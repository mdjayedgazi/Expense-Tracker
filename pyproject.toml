[project]
name = "expense-tracker-api"
version = "1.0.0"
description = "Personal Expense Tracker REST API built with FastAPI, SQLAlchemy and PostgreSQL"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
]